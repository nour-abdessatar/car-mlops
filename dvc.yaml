stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - src/common.py
      - data.tar
    params:
      - data
    outs:
      - artifacts/split.json

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/common.py
      - data.tar
      - artifacts/split.json
    params:
      - data.archive
      - train
    outs:
      - models/best.pt
      - models/classes.json
    metrics:
      - metrics/train.json:
          cache: false

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - src/evaluate.py
      - src/common.py
      - data.tar
      - models/best.pt
    params:
      - data.archive
      - train.model
      - train.image_size
      - train.batch_size
      - train.subset
      - train.device
    metrics:
      - metrics/eval.json:
          cache: false
