data:
  archive: data.tar
  val_fraction: 0.15
  seed: 42

train:
  model: convnext_tiny
  epochs: 10
  lr: 0.0001
  weight_decay: 0.05
  label_smoothing: 0.0
  drop_path: 0.0
  cosine: true
  augmentation: strong     # strong | basic
  batch_size: 32
  image_size: 224
  num_workers: 2
  subset: null             # e.g. 200 for a quick CPU smoke test
  device: auto             # auto | cpu | cuda
